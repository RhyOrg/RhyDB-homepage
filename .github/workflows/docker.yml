name: Docker image

on:
    push:
    workflow_dispatch:

env:
    DOCKER_IMAGE_NAME: ghcr.io/rhyorg/rhydb-homepage

jobs:
    dockerImage:
        name: Build and publish Docker image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: dockerMetadata
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.DOCKER_IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=raw,value=commit-${{ github.sha }}

            - name: Build and push image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.dockerMetadata.outputs.tags }}
                  labels: ${{ steps.dockerMetadata.outputs.labels }}
                  platforms: linux/amd64,linux/arm64
                  cache-from: type=gha,scope=rhydb-homepage-${{ github.ref }}
                  cache-to: type=gha,mode=max,scope=rhydb-homepage-${{ github.ref }}

            - name: Check that the container serves the site
              run: |
                  docker run -d --name rhydb-homepage -p 5001:5001 "$IMAGE"
                  for attempt in $(seq 30); do
                      curl -fs -o /dev/null http://127.0.0.1:5001/ && break
                      sleep 1
                  done
                  curl -fsS -D - -o /dev/null http://127.0.0.1:5001/ | grep -i '^cross-origin-embedder-policy: require-corp'
                  curl -fsS -o /dev/null http://127.0.0.1:5001/rhydb-wasm/rhydb_wasm.wasm
              env:
                  IMAGE: ${{ env.DOCKER_IMAGE_NAME }}:commit-${{ github.sha }}
