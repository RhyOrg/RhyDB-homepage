name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - id: pages
              uses: actions/configure-pages@v5
            - name: Build and upload Astro site
              uses: withastro/action@v6
              with:
                  node-version: 24
              env:
                  PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
                  # Optional: set a repository variable PUBLIC_RHYDB_DEFAULT_SERVER to override the default
                  # RhyDB server. Empty falls back to the built-in default (see src/config.ts).
                  PUBLIC_RHYDB_DEFAULT_SERVER: ${{ vars.PUBLIC_RHYDB_DEFAULT_SERVER }}
                  # Exercises use a separate, non-editable staging target.
                  PUBLIC_RHYDB_EXERCISE_SERVER: ${{ vars.PUBLIC_RHYDB_EXERCISE_SERVER }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
