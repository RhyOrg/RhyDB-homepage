server {
    listen 5001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects (e.g. /console -> /console/), so they stay correct behind a reverse proxy
    # instead of pointing to this container's internal port.
    absolute_redirect off;

    # Serve the .gz files precompressed in the Dockerfile to clients that accept gzip.
    gzip_static on;
    gzip_vary on;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
